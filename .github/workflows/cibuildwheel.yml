name: Build wheels (cibuildwheel)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # Fetch the source code. No submodules needed to build the Python 
      # extension. 
      - name: Checkout
        uses: actions/checkout@v4

      # Compile the C/C++ extension for every Python version listed in
      # [tool.cibuildwheel] in pyproject.toml. On Linux this runs inside a
      # manylinux Docker container so the resulting wheels work on any modern
      # Linux distro. On macOS it builds twice (arm64 + x86_64). On Windows it
      # uses the MSVC toolchain already on the runner. Wheels land in wheelhouse/.
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21

      # Save every .whl in wheelhouse/ as a downloadable CI artifact. The name
      # includes the OS so the three platform artifacts stay separate. Fails
      # loudly if no wheels were produced (rather than uploading an empty zip).
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
